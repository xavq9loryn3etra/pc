workflows:
  android-workflow:
    name: Android Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: 3.44.6
      groups:
        - google_play # Ensure these credentials are in Codemagic UI
        - gemini # GEMINI_API_KEY (Ask), a secret variable in Codemagic
    scripts:
      - name: Get dependencies
        script: |
          cd apps/flutter_client
          flutter pub get
      - name: Analyze and test
        script: |
          cd apps/flutter_client
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build Android Release
        script: |
          cd apps/flutter_client
          flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY
    artifacts:
      - apps/flutter_client/build/app/outputs/flutter-apk/*.apk

  windows-workflow:
    name: Windows Release
    max_build_duration: 120
    instance_type: windows_x2
    environment:
      flutter: 3.44.6
      groups:
        - gemini
    scripts:
      - name: Get dependencies
        script: |
          cd apps/flutter_client
          flutter pub get
      - name: Build Windows Release
        script: |
          cd apps/flutter_client
          flutter build windows --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY
    artifacts:
      - apps/flutter_client/build/windows/runner/Release/*.exe

  ios-workflow:
    name: iOS TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "popcorn"
    environment:
      flutter: 3.44.6
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
        - gemini
      vars:
        BUNDLE_ID: "com.popcorn.flutterClient"
    scripts:
      - name: Set up Keychain & Fetch Signing Files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      - name: Get dependencies
        script: |
          cd apps/flutter_client
          flutter pub get
      - name: Install Pods
        script: |
          cd apps/flutter_client/ios
          pod install
      - name: Build IPA for TestFlight
        script: |
          cd apps/flutter_client
          # This command now has the certificates it needs in the keychain
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY
    artifacts:
      - apps/flutter_client/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
