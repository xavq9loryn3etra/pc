name: Publish release

# Publishes Popcorn for Android (APK) and Windows (installer) to the public
# download page, https://github.com/popcorn-organization/popcorn, when the
# app's version in pubspec.yaml changes on main (e.g. 3.0.0 -> 3.0.1). A
# version already published is skipped. The new release is marked Latest;
# earlier ones stay listed below it as the archive. Once it's out, the app
# requires that version (docs/flags.json), so older copies ask to update.
#
# Secrets (on this repo):
#   RELEASES_TOKEN   fine-grained token with Contents: read and write on
#                    popcorn-organization/popcorn
#   GEMINI_API_KEY   for Popcorn Ask
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD   the release signing key: every APK must be signed
#                    with it, or it won't install over the one before it.
on:
  push:
    branches: [main]
    paths: ['flutter_client/pubspec.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  APP_DIR: flutter_client
  RELEASE_REPO: popcorn-organization/popcorn
  FLUTTER_VERSION: '3.44.6'

jobs:
  check:
    name: Is this version new?
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' "$APP_DIR/pubspec.yaml" | head -1)"
          if [ -z "$version" ]; then echo "No version: line in pubspec.yaml" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$GH_TOKEN" ]; then
            echo "The RELEASES_TOKEN secret isn't set, so nothing can be published." >&2
            exit 1
          fi
          if gh release view "v$version" -R "$RELEASE_REPO" > /dev/null 2>&1; then
            echo "Popcorn $version is already published: nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Popcorn $version is new: building it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "The Android signing key secrets aren't set." >&2; exit 1; fi
          # Stray line endings (a secret set from Windows) would break the decode.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/popcorn-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/popcorn-release.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/Popcorn-Android.apk"
      - name: Check it's signed with the release key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/out/Popcorn-Android.apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'CN=Popcorn, O=Popcorn Organization' "$RUNNER_TEMP/certs.txt" \
            || { echo "The APK isn't signed with the Popcorn release key." >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out/Popcorn-Android.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build windows --release "--dart-define=GEMINI_API_KEY=$env:GEMINI_API_KEY"
      - name: Inno Setup
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc) { choco install innosetup -y --no-progress }
      - name: Installer
        run: |
          ./windows/installer/build_installer.ps1 -SkipBuild
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
          Copy-Item "build\installer\Popcorn-Setup-${{ needs.check.outputs.version }}.exe" "$env:RUNNER_TEMP\out\Popcorn-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/out/Popcorn-Windows-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish to the download page
    needs: [check, android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # docs/flags.json, once the release is out
      pages: write      # republish the flags on GitHub Pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -l dist
          # When it was released, in the users' time (Sri Lanka).
          released_day="$(TZ=Asia/Colombo date '+%-d %B %Y')"
          released_at="$(TZ=Asia/Colombo date '+%-d %B %Y at %-I:%M %p')"
          cat > notes.md <<EOF
          **Popcorn $VERSION**, released on $released_at (Sri Lanka time).

          - **Android:** download **Popcorn-Android.apk** below and open it on your phone.
          - **Windows:** download **Popcorn-Windows-Setup.exe** below and run it. If Windows says it protected your PC, click **More info**, then **Run anyway**.

          Updating keeps your favourites and history. Earlier versions are listed below this one.

          <sub>Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}.</sub>
          EOF
          gh release create "v$VERSION" dist/Popcorn-Android.apk dist/Popcorn-Windows-Setup.exe \
            -R "$RELEASE_REPO" \
            --title "Popcorn $VERSION · $released_day" \
            --notes-file notes.md \
            --latest
          # The download page's "Latest version" line (between its markers).
          readme="$(gh api "repos/$RELEASE_REPO/contents/README.md")"
          sha="$(echo "$readme" | jq -r .sha)"
          echo "$readme" | jq -r .content | base64 -d > README.md
          line="**Latest version: $VERSION**, released on $released_at (Sri Lanka time)."
          awk -v line="$line" '
            /<!-- latest -->/ { print; print line; skip = 1; next }
            /<!-- \/latest -->/ { skip = 0 }
            !skip { print }
          ' README.md > README.new
          if ! cmp -s README.md README.new; then
            gh api -X PUT "repos/$RELEASE_REPO/contents/README.md" \
              -f message="Latest version: $VERSION" \
              -f content="$(base64 -w0 README.new)" \
              -f sha="$sha" > /dev/null
          fi

      # Only now that the files are out: the app requires this version, so
      # anyone older is asked to update (docs/flags.json, read by the app
      # from GitHub Pages). Android and Windows share the top-level values;
      # iPhone has its own entry there, as there's no iPhone release.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: pc
      - name: Require this version in the app
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd pc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          site="https://popcorn-organization.github.io/popcorn/"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main
            jq --arg v "$VERSION" --arg u "$site" \
              '.min_required_version = $v | .update_url = $u' \
              docs/flags.json > flags.tmp && mv flags.tmp docs/flags.json
            if git diff --quiet; then echo "The app already requires $VERSION."; break; fi
            git commit -qam "flags: require Popcorn $VERSION (published)"
            if git push -q origin HEAD:main; then echo "The app now requires $VERSION."; break; fi
            git reset -q --hard origin/main
          done
          # Publish the changed flags on GitHub Pages straight away.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || true
