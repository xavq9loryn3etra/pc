name: Release notice

# Tells the owner when a new version is on the download page, by email and
# in the GitHub app: one short comment by github-actions on this repo's "New
# versions" issue, which they're subscribed to. Kept short and without a
# mention, as it's what the notification shows (and a mention made it two).
# (Watching the download page's releases sends nothing: they're published
# with the owner's own token, and GitHub doesn't notify anyone of their own
# actions.) Runs after "Publish release"; a version already noted isn't
# noted again.
on:
  workflow_run:
    workflows: [Publish release]
    types: [completed]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  notice:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: MeghaJayalath
      RELEASE_REPO: popcorn-organization/popcorn
      TITLE: New versions
    steps:
      - name: Note the latest version
        run: |
          tag="$(gh release view -R "$RELEASE_REPO" --json tagName --jq .tagName)"
          note="Popcorn ${tag#v} is out"
          n="$(gh issue list -R "$GITHUB_REPOSITORY" --state all \
                --search "in:title \"$TITLE\" author:app/github-actions" \
                --json number --jq '.[0].number // empty')"
          if [ -z "$n" ]; then
            # (Mentioning the owner here subscribes them to it.)
            link="$(gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "New versions of Popcorn on the download page, noted for @$OWNER.")"
            n="${link##*/}"
            echo "Created issue #$n"
          fi
          if gh issue view "$n" -R "$GITHUB_REPOSITORY" --json comments \
               --jq '.comments[].body' | grep -qxF "$note"; then
            echo "$tag was noted already."
            exit 0
          fi
          gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$note"
          echo "Noted $tag on issue #$n."
